(function(){
'use strict';

function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);}

function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
function monthAdd(m,n){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthRange(m){const [y,mm]=m.split('-').map(Number);const last=new Date(y,mm,0).getDate();return [m+'-01',m+'-'+String(last).padStart(2,'0')];}
function fmtD(s){if(!s)return '—';const [y,m,d]=s.slice(0,10).split('-');return +d+' '+MON[+m-1]+' '+y;}
function fmtDS(s){if(!s)return '—';const [,m,d]=s.slice(0,10).split('-');return +d+' '+MON[+m-1];}
function fmtM(m){const [y,mm]=m.split('-');return MON[+mm-1]+' '+y;}
function fmtDT(s){if(!s)return '—';const t=s.slice(11,16);return fmtD(s)+(t?', '+t:'');}

function inrC(n){if(n==null||isNaN(n))return '—';const a=Math.abs(n),s=n<0?'−':'';if(a>=1e7)return s+'₹'+(a/1e7).toFixed(2)+' Cr';if(a>=1e5)return s+'₹'+(a/1e5).toFixed(2)+' L';return s+'₹'+Math.round(a).toLocaleString('en-IN');}

const div=(a,b)=>b?a/b:null;

const LS_KEY='rfd-state-v1',LS_VIEW='rfd-viewer';
const Store={mode:'local',version:0,
  async init(){
    try{const r=await fetch('api/state',{cache:'no-store'});
      if(r.ok&&(r.headers.get('content-type')||'').includes('json')){const j=await r.json();this.mode='server';this.version=j.version||0;return j.data||null;}}catch(e){}
    try{const s=localStorage.getItem(LS_KEY);return s?JSON.parse(s):null;}catch(e){return null;}
  },
  async save(data){
    if(this.mode==='server'){
      try{const r=await fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json','If-Match':String(this.version)},body:JSON.stringify(data)});
        if(r.status===401){location.reload();return {error:'Your session ended. Sign in again.'};}
        const j=await r.json();if(r.status===409){this.version=j.version;return {conflict:j.data};}
        if(!r.ok)return {error:j.error||'Save failed'};this.version=j.version;return {ok:true};}
      catch(e){return {error:'Could not reach the server. Your change was not saved.'};}
    }
    try{localStorage.setItem(LS_KEY,JSON.stringify(data));}catch(e){return {error:'This browser\'s storage is full, so the last change was not kept. Remove some creatives, or use the server version for large files.'};}
    return {ok:true};
  },
  async poll(){
    if(this.mode!=='server')return null;

/* ---------- numbers ---------- */
function effectiveReports(pid,F,T){
  const rs=D().reports.filter(r=>r.projectId===pid&&(!F||r.to>=F)&&(!T||r.from<=T))
    .sort((a,b)=>(PRI[b.type]-PRI[a.type])||b.at.localeCompare(a.at));
  const kept=[];rs.forEach(r=>{if(!kept.some(k=>k.from<=r.to&&r.from<=k.to))kept.push(r);});return kept;
}
function effectivePlans(pid,F,T){
  const by={};D().plans.filter(p=>p.projectId===pid).forEach(p=>{const [f,t]=monthRange(p.month);if((F&&t<F)||(T&&f>T))return;if(!by[p.month]||by[p.month].at<p.at)by[p.month]=p;});
  return Object.values(by);
}
function freshness(p){
  const rs=D().reports.filter(r=>r.projectId===p.id);
  if(!rs.length)return {state:'none',label:'No reports yet',lastTo:null,lastAt:null};
  const lastTo=rs.reduce((a,r)=>r.to>a?r.to:a,''),lastAt=rs.reduce((a,r)=>r.at>a?r.at:a,'');
  const age=daysBetween(lastTo,todayISO()),c=CAD[p.cadence]||7;
  const state=age<=c+1?'ok':age<=c*2+1?'due':'late';
  return {state,label:state==='ok'?'Up to date':state==='due'?'Update due':'Overdue',lastTo,lastAt,age};
}
const FR_RANK={ok:0,due:1,late:2,none:3};
function updatedAsOn(pids){const set=new Set(pids);let lastTo='',lastAt='';D().reports.forEach(r=>{if(!set.has(r.projectId))return;if(r.to>lastTo)lastTo=r.to;if(r.at>lastAt)lastAt=r.at;});return {lastTo,lastAt};}
function stats(pid){
  const {from,to}=app.ui;
  const reps=effectiveReports(pid,from,to),plans=effectivePlans(pid,from,to);
  const actual=sumRows(reps.flatMap(r=>r.rows)),plan=sumPlans(plans);
  const received=D().money.filter(m=>m.projectId===pid).reduce((a,m)=>a+(+m.amount||0),0);
  const spentAll=effectiveReports(pid,'','').reduce((a,r)=>a+r.rows.reduce((b,x)=>b+(+x.spend||0),0),0);
  const allocated=effectivePlans(pid,'','').reduce((a,p)=>a+p.rows.reduce((b,x)=>b+(+x.spend||0),0),0);
  const blocked=(D().blocks||[]).filter(b=>b.projectId===pid).reduce((a,b)=>a+(+b.amount||0),0);
  if(bookingsHidden(pid)){actual.bookings=0;plan.bookings=0;actual.noBookings=true;}
  return {actual,plan,received,blocked,media:received-blocked,spentAll,allocated,balance:received-blocked-spentAll,reps,plans};
}
function aggregate(pids){
  const out={actual:zero(),plan:zero(),received:0,blocked:0,media:0,spentAll:0,allocated:0,balance:0,worst:'ok',count:pids.length};
  pids.forEach(id=>{const s=stats(id);addTo(out.actual,s.actual);addTo(out.plan,s.plan);out.received+=s.received;out.blocked+=s.blocked;out.media+=s.media;out.spentAll+=s.spentAll;out.allocated+=s.allocated;out.balance+=s.balance;
    const f=freshness(proj(id)).state;if(FR_RANK[f]>FR_RANK[out.worst])out.worst=f;});
  return out;
}

/* ---------- parsing uploaded files ---------- */
const HEAD=[
  ['channel',/^(channel|platform|source|medium|campaign\s*type)$/i],
  ['spend',/^(spends?|cost|amount\s*spent|spent|budget|planned\s*spends?|media\s*spends?|planned\s*budget)(\s*\(.*\))?$/i],
  ['impr',/^(impressions?|impr\.?|imps?)$/i],
  ['clicks',/^(clicks?|link\s*clicks?)$/i],
  ['ql',/^(ql|qls|qualified\s*leads?)$/i],
  ['leads',/^(leads?|total\s*leads?)$/i],
  ['sv',/^(sv|svs|site\s*visits?)$/i],
  ['bookings',/^(bookings?|sales|closures?|conversions?)$/i],
  ['cpl',/^cpl$/i]];
function toNum(v){const s=String(v??'').replace(/₹|rs\.?|inr|,|\s/gi,'');if(!s||/^[-–—]$/.test(s))return 0;const n=parseFloat(s);return isNaN(n)?0:n;}
function parseRows(rows){
  for(let i=0;i<rows.length;i++){
    const map={};(rows[i]||[]).forEach((c,j)=>{const t=String(c).trim();for(const [k,re] of HEAD){if(map[k]===undefined&&re.test(t)){map[k]=j;break;}}});
    if(map.channel===undefined||(map.spend===undefined&&map.leads===undefined))continue;
    const out=[];let total=null;
    for(let r=i+1;r<rows.length;r++){const row=rows[r]||[];const ch=String(row[map.channel]??'').trim();
      if(!ch){if(out.length)break;continue;}if(/^(grand\s*)?total/i.test(ch)){total={spend:map.spend===undefined?0:toNum(row[map.spend]),leads:map.leads===undefined?0:toNum(row[map.leads])};break;}
      const o={channel:ch};METRICS.forEach(k=>o[k]=map[k]===undefined?0:toNum(row[map[k]]));if(map.cpl!==undefined)o.cpl=toNum(row[map.cpl]);out.push(o);}
    let title='';for(let r=0;r<i;r++){const t=(rows[r]||[]).filter(x=>String(x).trim()).join(' ');if(t)title=t;}
    return {rows:out,title,found:Object.keys(map),total};
  }
  return null;
}
function parsePeriod(t){
  const m=String(t).match(/(\d{1,2})(?:st|nd|rd|th)?\s*([A-Za-z]{3,})\.?,?\s*(\d{4})?\s*(?:-|–|to)\s*(\d{1,2})(?:st|nd|rd|th)?\s*([A-Za-z]{3,})\.?,?\s*(\d{4})?/i);
  if(!m)return null;const mi=s=>MON.findIndex(x=>x.toLowerCase()===s.slice(0,3).toLowerCase());const m1=mi(m[2]),m2=mi(m[5]);if(m1<0||m2<0)return null;
  const y2=m[6]?+m[6]:new Date().getFullYear(),y1=m[3]?+m[3]:(m1>m2?y2-1:y2);
  const f=y1+'-'+String(m1+1).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'),t2=y2+'-'+String(m2+1).padStart(2,'0')+'-'+String(+m[4]).padStart(2,'0');
  return f<=t2?{from:f,to:t2}:null;
}
window.RFD_PARSE={parseRows,parsePeriod,toNum};

function funnel(x){
  const st=[['Spend',x.spend,null,true],['Impressions',x.impr],['Clicks',x.clicks],['Leads',x.leads],['Qualified leads',x.ql],['Site visits',x.sv]].concat(x.noBookings?[]:[['Bookings',x.bookings]]);
  const costLbl={Clicks:'CPC',Leads:'CPL','Qualified leads':'CPQL','Site visits':'CPSV',Bookings:'CPB'};
  let prev=null;
  const rows=st.map(([n,v,,money],i)=>{
    if(money)return `<div class="fun-row"><span class="n">${n}</span><span class="conv">Total media cost in period</span><span class="val">${inrC(v)}</span></div>`;
    const missing=!v&&(n==='Impressions'||n==='Clicks');

    return `<div class="fun-row"><span class="n">${n}</span><span class="conv">${conv}</span><span class="val">${missing?'—':num(v)}</span></div>`;
  }).join('');
  return `<div class="panel"><div class="panel-h"><h2>Full funnel</h2><span class="muted" style="font-size:.8rem">Conversion from the stage above</span></div><div class="fun">${rows}</div></div>`;
}

const BLOBS={};
const docHref=d=>d.url||BLOBS[d.id]||null;
function fileKind(name,mime){const n=(name||'').toLowerCase();mime=mime||'';
  if(/^image\//.test(mime)||/\.(png|jpe?g|gif|webp|svg)$/.test(n))return 'image';
  if(/^video\//.test(mime)||/\.(mp4|mov|webm|m4v)$/.test(n))return 'video';
  if(mime==='application/pdf'||/\.pdf$/.test(n))return 'pdf';
  if(/\.pptx?$/.test(n))return 'ppt';if(/\.(xlsx?|csv)$/.test(n))return 'sheet';return 'other';}
const extOf=n=>{const m=(n||'').match(/\.([a-z0-9]+)$/i);return m?m[1].toUpperCase():'FILE';};
const fmtSize=b=>!b?'':b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function usedSet(){const used=new Set();D().projects.forEach(p=>{effectiveReports(p.id,'','').forEach(r=>used.add(r.id));effectivePlans(p.id,'','').forEach(x=>used.add(x.id));});return used;}
function entries(pidSet){
  const out=[],used=usedSet();
  D().reports.forEach(r=>{if(!pidSet.has(r.projectId))return;const t=sumRows(r.rows);
    out.push({id:r.id,warn:(r.warnings||[]).length,kind:'Report',period:r.type,projectId:r.projectId,at:r.at,label:'Performance data · '+r.type,covers:fmtDS(r.from)+' – '+fmtD(r.to),file:r.file,by:r.uploadedBy,spend:t.spend,leads:t.leads,href:r.url,superseded:!used.has(r.id)});});
  D().plans.forEach(x=>{if(!pidSet.has(x.projectId))return;const t=sumRows(x.rows);
    out.push({id:x.id,kind:'Plan',period:'plan',projectId:x.projectId,at:x.at,label:'Media plan',covers:fmtM(x.month),file:x.file,by:x.uploadedBy,spend:t.spend,leads:t.leads,href:x.url,superseded:!used.has(x.id)});});
  (D().docs||[]).forEach(d=>{if(!pidSet.has(d.projectId))return;
    out.push({id:d.id,kind:d.category==='deck'?'Presentation':'Creative',period:d.category==='deck'?d.type:'creative',projectId:d.projectId,at:d.at,
      label:d.category==='deck'?'Report presentation · '+d.type:'Creative'+(d.channel?' · '+d.channel:''),covers:d.from?fmtDS(d.from)+' – '+fmtD(d.to):'—',
      file:d.file,title:d.title,size:d.size,mime:d.mime,by:d.uploadedBy,spend:null,leads:null,href:docHref(d),doc:true,example:d.example});});
  (D().raws||[]).forEach(f=>{if(!pidSet.has(f.projectId))return;
    out.push({id:f.id,kind:'Platform export',period:'raw',projectId:f.projectId,at:f.at,label:f.platform+' '+({full:'campaigns / ad sets',creative:'creatives',keyword:'keywords'}[f.level||'full'])+' · '+num(f.rows.length)+' rows',covers:fmtDS(f.from)+' – '+fmtD(f.to),file:f.file,by:f.uploadedBy,spend:f.rows.reduce((t,r)=>t+r.spend,0),leads:f.rows.reduce((t,r)=>t+r.leads,0),href:f.url});});
  (D().crm||[]).forEach(c=>{if(!pidSet.has(c.projectId))return;const n=Object.values(c.status||{}).reduce((t,o)=>t+Object.values(o).reduce((x,y)=>x+y,0),0);
    out.push({id:c.id,kind:'CRM data',period:'raw',projectId:c.projectId,at:c.at,label:'CRM lead data'+(n?' · '+num(n)+' leads':''),covers:c.label||(fmtDS(c.from)+' – '+fmtD(c.to)),file:c.file,by:c.uploadedBy,spend:null,leads:n||null,href:c.url});});
  return out.sort((a,b)=>b.at.localeCompare(a.at));
}
function fileActions(x){
  const k=fileKind(x.file,x.mime);

  const view=['image','pdf','video'].includes(k)?`<button class="btn link" data-act="viewDoc" data-v="${x.id}">View</button> · `:'';
  const dl=/^(blob|data):/.test(x.href)?'':`<a href="${esc(x.href)}${x.href.includes('?')?'&':'?'}download=1" target="_blank" rel="noopener">Download</a>`;
  return view+dl||'<span class="muted">Saved for this session</span>';
}

async function handleFiles(list){
  const up=app.ui.up,files=[...list];if(!files.length)return;
  up.error='';up.done='';up.parsed=null;up.files=KINDS[up.kind].multi?files:[files[0]];
  const file=up.files[0];
  const per=parsePeriod(file.name);
  if(!KINDS[up.kind].parsed){
    if(up.kind==='deck'&&per){up.from=per.from;up.to=per.to;}
    render();return;
  }
  if(typeof XLSX==='undefined'){up.error='The spreadsheet reader is not available.';render();return;}
  if(KINDS[up.kind].crm){
    try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});let res=null;
      for(const n of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:'',dateNF:'yyyy-mm-dd'});res=parseCrm(rows);if(res&&res.n)break;}
      if(!res||!res.n){up.error='No lead rows with a status column were found. The file needs a column such as Status, Lead Status or Call Status.';render();return;}
      up.parsed=res;if(res.from){up.from=res.from;up.to=res.to;}
    }catch(e){up.error='This file could not be read. Save it as .csv or .xlsx and try again.';}
    render();return;
  }
  if(KINDS[up.kind].raw){
    try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});let res=null;
      for(const n of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:'',dateNF:'yyyy-mm-dd'});res=parseRaw(rows);if(res&&res.rows.length)break;}
      if(!res||!res.rows.length){up.error='No campaign rows with spend were found. The export needs a Campaign (or Ad set / Ad) column and a spend column such as Amount spent or Cost.';render();return;}
      up.parsed=res;if(res.guess)up.platform=res.guess;up.level=res.level||'full';
      const ds=res.rows.flatMap(r=>[r.date,r.dateEnd]).filter(Boolean).sort();
      if(ds.length){up.from=ds[0];up.to=ds[ds.length-1];}else{const pp=titleRange(res.title)||parsePeriod(res.title)||titleRange(file.name)||per;if(pp){up.from=pp.from;up.to=pp.to;}}
    }catch(e){up.error='This file could not be read. Save it as .csv or .xlsx and try again.';}
    render();return;
  }
  try{
    const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});let res=null;
    for(const n of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});res=parseRows(rows);if(res&&res.rows.length)break;}
    if(!res||!res.rows.length){up.error='No table with a Channel column was found in this file. Check the column names listed below.';render();return;}
    up.parsed=res;
    const p2=parsePeriod(res.title)||per;
    if(p2){if(up.kind==='report'){up.from=p2.from;up.to=p2.to;const d=daysBetween(p2.from,p2.to);up.type=d<1?'daily':d<=8?'weekly':'monthly';}else up.month=p2.from.slice(0,7);}
  }catch(e){up.error='This file could not be read. Save it as .xlsx or .csv and try again.';}
  render();
}
function resetUp(up){Object.assign(up,{parsed:null,files:[],error:'',title:''});}
async function saveUpload(){
  const up=app.ui.up,p=proj(up.projectId);if(!p||!up.files.length)return;
  const needDates=up.kind==='report'||up.kind==='deck';
  if(needDates&&(!up.from||!up.to||up.from>up.to)){up.error='Enter the dates this report covers (from must be on or before to).';render();return;}
  if(up.kind==='plan'&&!up.month){up.error='Choose the month this plan is for.';render();return;}
  const at=nowStamp(),by=app.ui.viewer;
  if(KINDS[up.kind].crm){
    if(!up.parsed)return;if(!up.from||!up.to||up.from>up.to){up.error='Enter the dates these leads were created (from must be on or before to).';render();return;}
    const f=up.files[0],url=await Store.putFile(f);const pr=up.parsed;
    const rec={id:uid('crm'),projectId:p.id,from:up.from,to:up.to,label:fmtDS(up.from)+' – '+fmtD(up.to),status:pr.status,lost:pr.lost,svSource:pr.svSource,file:f.name,url,uploadedBy:by,at};
    resetUp(up);up.done=`Saved CRM data for ${num(pr.n)} leads to ${p.name}. Lead quality, observations and way forward are updated.`;
    await commit(d=>{d.crm=d.crm||[];d.crm.push(rec);},`Uploaded CRM lead data (${num(pr.n)} leads) for ${p.name}`,p.id);return;
  }
  if(KINDS[up.kind].raw){
    if(!up.parsed)return;
    if(!up.from||!up.to||up.from>up.to){up.error='Enter the dates this export covers (from must be on or before to).';render();return;}
    const f=up.files[0],url=await Store.putFile(f);
    const rec={id:uid('rw'),projectId:p.id,platform:up.platform||'Other',from:up.from,to:up.to,level:up.level||'full',rows:up.parsed.rows,file:f.name,url,uploadedBy:by,at};
    const label=`${rec.platform} export ${fmtDS(rec.from)} – ${fmtDS(rec.to)}`;
    resetUp(up);up.done=`Saved the ${label} to ${p.name}. Spend verification and campaign performance are updated.`;
    await commit(d=>{d.raws=d.raws||[];d.raws.push(rec);},`Uploaded ${label} for ${p.name}`,p.id);
    return;
  }
  if(KINDS[up.kind].parsed){
    if(!up.parsed)return;
    const f=up.files[0],url=await Store.putFile(f);
    const rec={id:uid(up.kind==='report'?'r':'pl'),projectId:p.id,rows:up.parsed.rows,file:f.name,url,uploadedBy:by,at};
    if(up.kind==='report')Object.assign(rec,{type:up.type,from:up.from,to:up.to,warnings:checkReport(p.id,up.parsed,up.type,up.from,up.to)});else rec.month=up.month;
    const label=up.kind==='report'?`${up.type} report ${fmtDS(up.from)} – ${fmtDS(up.to)}`:`plan for ${fmtM(up.month)}`;
    resetUp(up);up.done=`Saved the ${label} to ${p.name}.`;
    await commit(d=>{(up.kind==='report'?d.reports:d.plans).push(rec);},`Uploaded ${label} for ${p.name}`,p.id);
    return;
  }
  up.done='Uploading…';render();
  const recs=[];
  for(const f of up.files){
    const id=uid('d'),url=await Store.putFile(f);
    if(!url)BLOBS[id]=URL.createObjectURL(f);
    const rec={id,projectId:p.id,category:up.kind,title:up.kind==='creative'?(up.files.length===1&&up.title?up.title:f.name.replace(/\.[^.]+$/,'')):f.name.replace(/\.[^.]+$/,''),file:f.name,size:f.size,mime:f.type,url,uploadedBy:by,at};
    if(up.kind==='deck')Object.assign(rec,{type:up.type,from:up.from,to:up.to});else if(up.channel)rec.channel=up.channel;
    recs.push(rec);
  }
  const label=up.kind==='deck'?`${up.type} report presentation`:`${recs.length} creative${recs.length>1?'s':''}`;
  resetUp(up);up.done=`Saved ${label} to ${p.name}.${Store.mode==='local'?' In this preview, files can be viewed until the page is reloaded.':''}`;
  await commit(d=>{d.docs=d.docs||[];recs.forEach(r=>d.docs.push(r));},`Uploaded ${label} for ${p.name}`,p.id);
}

let MEMO={};
const memo=(k,f)=>k in MEMO?MEMO[k]:(MEMO[k]=f());
const PLATFORMS=['Meta','Google','LinkedIn','Taboola','Other'];
function platformOf(ch){const c=String(ch).toLowerCase();
  if(/\bfb\b|facebook|meta|insta|\big\b/.test(c))return 'Meta';
  if(/google|youtube|\byt\b|pmax|performance max|search|demand gen|display|gdn|discovery/.test(c))return 'Google';
  if(/linkedin/.test(c))return 'LinkedIn';if(/taboola/.test(c))return 'Taboola';return 'Other';}
const ymd=(y,m,d)=>(m>=1&&m<=12&&d>=1&&d<=31&&y>1999)?y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'):'';
function parseDateStr(s){s=String(s||'').trim();if(!s)return '';let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return ymd(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;let d=a,mo=b;if(b>12&&a<=12){d=b;mo=a;}return ymd(y,mo,d);}
  const mi=x=>MON.findIndex(n=>n.toLowerCase()===x.slice(0,3).toLowerCase())+1;
  if((m=s.match(/^(\d{1,2})(?:st|nd|rd|th)?[\s\-]+([A-Za-z]{3,})[\s\-,]+(\d{4})/)))return ymd(+m[3],mi(m[2]),+m[1]);
  if((m=s.match(/^(?:[A-Za-z]{3,},?\s+)?([A-Za-z]{3,})\s+(\d{1,2}),?\s+(\d{4})/)))return ymd(+m[3],mi(m[1]),+m[2]);
  return '';}
const DATE_RE='([A-Za-z]{3,}\\s+\\d{1,2},?\\s+\\d{4}|\\d{1,2}\\s+[A-Za-z]{3,},?\\s+\\d{4}|\\d{4}-\\d{2}-\\d{2}|\\d{1,2}\\/\\d{1,2}\\/\\d{2,4})';
function titleRange(t){const m=String(t).match(new RegExp(DATE_RE+'\\s*(?:-|–|to)\\s*'+DATE_RE,'i'));if(!m)return null;const a=parseDateStr(m[1]),b=parseDateStr(m[2]);return a&&b&&a<=b?{from:a,to:b}:null;}
const RAW_HEAD=[
  ['date',/^(day|date|reporting\s*starts)$/i],
  ['dateEnd',/^reporting\s*ends$/i],
  ['campaign',/^campaign(\s*name)?$/i],
  ['adset',/^(ad\s*set(\s*name)?|ad\s*group(\s*name)?|audience(\s*segment)?(\s*name)?|asset\s*group(\s*name)?|line\s*item)$/i],
  ['ad',/^(ad(\s*name)?|creative(\s*name)?|headline(\s*1)?|asset)$/i],
  ['spend',/^(amount\s*spent(\s*\(.*\))?|cost(\s*\(.*\))?|spends?(\s*\(.*\))?|total\s*spent)$/i],
  ['impr',/^(impressions?|impr\.?)$/i],
  ['clicks',/^(link\s*clicks|clicks(\s*\(all\))?)$/i],
  ['leads',/^(leads?(\s*\(form\))?|results|conversions|all\s*conv\.?|on-facebook\s*leads|website\s*leads|meta\s*leads)$/i],
  ['keyword',/^(keyword|search\s*keyword|search\s*term)$/i],['ql',/^(ql|qualified\s*leads?)$/i],['sv',/^(sv|site\s*visits?)$/i],['status',/^(status|delivery|ad\s*set\s*delivery|campaign\s*state)$/i]];
function parseRaw(rows){
  for(let i=0;i<Math.min(rows.length,40);i++){
    const hdr=(rows[i]||[]).map(c=>String(c).trim());const map={};
    hdr.forEach((t,j)=>{for(const [k,re] of RAW_HEAD){if(map[k]===undefined&&re.test(t)){map[k]=j;break;}}});
    if(map.spend===undefined||(map.campaign===undefined&&map.adset===undefined&&map.ad===undefined&&map.keyword===undefined))continue;
    const hj=hdr.join('|').toLowerCase();
    const guess=/amount spent|ad set|reach|result/.test(hj)?'Meta':/cost|impr\.|ad group|conv\./.test(hj)?'Google':/linkedin|campaign group/.test(hj)?'LinkedIn':'';
    const out=[];
    for(let r=i+1;r<rows.length;r++){const row=rows[r]||[];const g=k=>map[k]===undefined?'':String(row[map[k]]??'').trim();
      const name=g('campaign')||g('adset')||g('ad')||g('keyword');if(!name)continue;
      if(/^total/i.test(name)||/^total/i.test(String(row[0]||'')))continue;
      const o={date:parseDateStr(g('date')),campaign:g('campaign')||'—',adset:g('adset')||'—',ad:g('keyword')||g('ad')||'—',spend:toNum(g('spend')),impr:toNum(g('impr')),clicks:toNum(g('clicks')),leads:toNum(g('leads'))};
      if(map.ql!==undefined)o.ql=toNum(g('ql'));if(map.sv!==undefined)o.sv=toNum(g('sv'));if(map.status!==undefined)o.status=g('status');
      const de=parseDateStr(g('dateEnd'));if(de&&de!==o.date)o.dateEnd=de;
      if(!o.spend&&!o.impr&&!o.clicks&&!o.leads)continue;out.push(o);}
    let title='';for(let r=0;r<i;r++){const t=(rows[r]||[]).filter(x=>String(x).trim()).join(' ');if(t)title+=(title?' ':'')+t;}
    const level=map.keyword!==undefined?'keyword':(map.ad!==undefined&&map.campaign===undefined&&map.adset===undefined)?'creative':'full';
    return {rows:out,found:Object.keys(map),guess,title,level};
  }
  return null;
}

function verifySummary(pids){const s={ok:0,due:0,late:0,none:0,total:0};pids.forEach(id=>verifyProject(id).forEach(c=>{s[c.state]++;s.total++;}));return s;}
function verifyChip(pids){const s=verifySummary(pids);if(!s.total)return '';
  if(s.late)return `<span class="chip late">${s.late} spend mismatch${s.late>1?'es':''}</span>`;
  if(s.due)return `<span class="chip due">${s.due} small spend gap${s.due>1?'s':''}</span>`;
  if(s.ok&&!s.none)return '<span class="chip ok">Spend verified</span>';
  if(s.ok)return `<span class="chip ok">${s.ok} of ${s.total} verified</span>`;
  return '<span class="chip ro">Spend not verified</span>';}

/* ---------- automatic checks on team uploads ---------- */
function checkReport(pid,pr,type,from,to){
  const w=[],p=proj(pid),rows=pr.rows,t=sumRows(rows);
  if(pr.total){if(pr.total.spend&&Math.abs(pr.total.spend-t.spend)>Math.max(5,t.spend*.002))w.push(`File total spend ${inr(pr.total.spend)} doesn't match the sum of channels ${inr(t.spend)}.`);
    if(pr.total.leads&&pr.total.leads!==t.leads)w.push(`File total leads ${num(pr.total.leads)} doesn't match the sum of channels ${num(t.leads)}.`);}
  rows.forEach(r=>{const n=r.channel;
    if(r.spend<0||r.leads<0||r.ql<0||r.sv<0)w.push(`${n}: has negative values.`);
    if(r.ql>r.leads)w.push(`${n}: more qualified leads (${num(r.ql)}) than leads (${num(r.leads)}).`);
    if(r.sv>r.ql)w.push(`${n}: more site visits (${num(r.sv)}) than qualified leads (${num(r.ql)}).`);
    if(r.bookings>r.sv)w.push(`${n}: more bookings (${num(r.bookings)}) than site visits (${num(r.sv)}).`);
    if(r.impr>0&&r.clicks>r.impr)w.push(`${n}: more clicks than impressions.`);
    if(r.cpl&&r.leads){const c=r.spend/r.leads;if(Math.abs(c-r.cpl)/c>0.02)w.push(`${n}: CPL in the file (${inr(r.cpl)}) differs from spend ÷ leads (${inr(c)}).`);}
    if(r.spend>0&&!r.leads&&!r.clicks&&!r.impr)w.push(`${n}: spend with no leads, clicks or impressions.`);});
  if(from&&to){const len=daysBetween(from,to)+1;
    if(type==='daily'&&len!==1)w.push(`A daily report should cover 1 day; this covers ${len}.`);
    if(type==='weekly'&&(len<5||len>9))w.push(`A weekly report usually covers 7 days; this covers ${len}.`);
    if(type==='monthly'&&(len<20||len>31))w.push(`A monthly report usually covers a month; this covers ${len} days.`);
    if(p&&from<p.startDate)w.push(`Starts before the project start date (${fmtD(p.startDate)}).`);
    if(to>todayISO())w.push('Ends in the future.');
    const ov=D().reports.filter(r=>r.projectId===pid&&r.type===type&&r.from<=to&&from<=r.to);
    if(ov.length)w.push(`Overlaps ${ov.length} existing ${type} report${ov.length>1?'s':''} (${ov.map(r=>fmtDS(r.from)+' – '+fmtDS(r.to)).join(', ')}). The newer upload will be used for those days.`);}
  const known=new Set([...D().plans,...D().reports].filter(x=>x.projectId===pid).flatMap(x=>x.rows.map(r=>r.channel.toLowerCase())));
  if(known.size)rows.forEach(r=>{if(!known.has(r.channel.toLowerCase()))w.push(`"${r.channel}" is a new channel name for this project. Check for typos.`);});
  const hist=D().reports.filter(r=>r.projectId===pid&&r.type===type&&r.to<(from||'9999')).sort((a,b)=>b.to.localeCompare(a.to)).slice(0,4);
  if(hist.length>=2){const hs=sumRows(hist.flatMap(r=>r.rows));const avgCpl=div(hs.spend,hs.leads),cpl=div(t.spend,t.leads);
    if(avgCpl&&cpl&&Math.abs(cpl-avgCpl)/avgCpl>.5)w.push(`CPL ${inr(cpl)} is more than 50% ${cpl>avgCpl?'above':'below'} the average of the last ${hist.length} ${type} reports (${inr(avgCpl)}).`);
    const avgSpend=hs.spend/hist.length;if(avgSpend&&Math.abs(t.spend-avgSpend)/avgSpend>.5)w.push(`Spend ${inr(t.spend)} is more than 50% ${t.spend>avgSpend?'above':'below'} the recent average (${inr(avgSpend)}).`);}
  return w;
}
function warnBox(ws){

function platformFor(pid,ch){const m=(((D().profiles||{})[pid]||{}).channelMap)||{};return m[ch]||platformOf(ch);}
const bookingsHidden=pid=>{const pf=((D().profiles||{})[pid]||{});const {from,to}=app.ui;return !!(pf.bookingsQuarterly&&from&&to&&daysBetween(from,to)<60);};
function sumPlans(plans){const s=zero();plans.forEach(p=>{const r=sumRows(p.rows);if(p.totals)['ql','sv','bookings'].forEach(k=>{if(p.totals[k]!=null&&p.totals[k]!=='')r[k]=+p.totals[k];});addTo(s,r);});return s;}

/* ---------- platform data (overrides the earlier versions) ---------- */
const lvlOf=f=>f.level||'full';
function rawDaily(pid,pl){return memo('rd|'+pid+'|'+pl,()=>{
  const files=(D().raws||[]).filter(f=>f.projectId===pid&&f.platform===pl&&lvlOf(f)==='full').sort((a,b)=>a.at.localeCompare(b.at));const day={};
  files.forEach(f=>{const per={};
    f.rows.forEach(r=>{const s=r.date||f.from,e=r.dateEnd||r.date||f.to;const n=Math.max(1,daysBetween(s,e)+1);
      for(let i=0;i<n;i++){const d=n===1?s:addDays(s,i);const o=per[d]=per[d]||{spend:0,leads:0};o.spend+=r.spend/n;o.leads+=r.leads/n;}});
    for(let d=f.from;d<=f.to;d=addDays(d,1))day[d]=per[d]||{spend:0,leads:0};});
  return day;});}
function rawAgg(pid,pl,level){level=level||'full';const {from,to}=app.ui;return memo('ra|'+pid+'|'+pl+'|'+level+'|'+from+'|'+to,()=>{
  const res=[],byPl={};
  (D().raws||[]).filter(f=>f.projectId===pid&&(!pl||f.platform===pl)&&lvlOf(f)===level).forEach(f=>(byPl[f.platform]=byPl[f.platform]||[]).push(f));
  Object.entries(byPl).forEach(([P,files])=>{files.sort((a,b)=>b.at.localeCompare(a.at));const claimed=[];
    files.forEach(f=>{f.rows.forEach(r=>{const s=r.date||f.from,e=r.dateEnd||r.date||f.to;const n=Math.max(1,daysBetween(s,e)+1);let k=0;
        for(let i=0;i<n;i++){const d=n===1?s:addDays(s,i);if(from&&d<from)continue;if(to&&d>to)continue;if(claimed.some(c=>d>=c[0]&&d<=c[1]))continue;k++;}
        if(!k)return;const fr=k/n;res.push({platform:P,campaign:r.campaign,adset:r.adset,ad:r.ad,spend:r.spend*fr,impr:(r.impr||0)*fr,clicks:(r.clicks||0)*fr,leads:(r.leads||0)*fr,
          ql:r.ql==null?null:r.ql*fr,sv:r.sv==null?null:r.sv*fr,status:r.status||'',start:r.start||'',to:f.to});});
      claimed.push([f.from,f.to]);});});
  return res;});}
function topRows(raw,k,n){const g={};raw.forEach(r=>{const key=r[k];if(!key||key==='—')return;
    const o=g[key]=g[key]||{name:key,platform:r.platform,campaign:r.campaign,spend:0,impr:0,clicks:0,leads:0,ql:null,sv:null,status:'',last:''};
    if(o.platform!==r.platform)o.platform='Mixed';o.spend+=r.spend;o.impr+=r.impr;o.clicks+=r.clicks;o.leads+=r.leads;
    if(r.ql!=null)o.ql=(o.ql||0)+r.ql;if(r.sv!=null)o.sv=(o.sv||0)+r.sv;
    if(r.status){if((r.to||'')>o.last){o.last=r.to||'';o.status=r.status;o.anyActive=false;}if((r.to||'')===o.last){if(/active/i.test(r.status))o.anyActive=true;o.status=o.anyActive?'Active':r.status;}}});
  return Object.values(g).sort((a,b)=>b.spend-a.spend).slice(0,n||9999);}
function verifyProject(pid){return memo('vp|'+pid,()=>{
  const out=[],have=new Set((D().raws||[]).filter(f=>f.projectId===pid&&lvlOf(f)==='full').map(f=>f.platform));
  effectiveReports(pid,'','').forEach(r=>{const byP={};
    r.rows.forEach(x=>{const pl=platformFor(pid,x.channel);const o=byP[pl]=byP[pl]||{spend:0,leads:0,channels:[]};o.spend+=x.spend;o.leads+=x.leads;o.channels.push(x.channel);});
    Object.entries(byP).forEach(([pl,t])=>{
      if(!t.spend||pl==='Offline')return;
      if(!have.has(pl)){out.push({r,pl,team:t,state:'none'});return;}
      const day=rawDaily(pid,pl);let ps=0,pls=0,ok=true;
      for(let d=r.from;d<=r.to;d=addDays(d,1)){const o=day[d];if(!o){ok=false;break;}ps+=o.spend;pls+=o.leads;}
      if(!ok){out.push({r,pl,team:t,state:'none',partial:true});return;}
      const diff=t.spend-ps,rel=ps?Math.abs(diff)/ps:(t.spend?1:0);
      out.push({r,pl,team:t,platform:{spend:ps,leads:pls},diff,rel,state:rel<=0.02?'ok':rel<=0.10?'due':'late'});});});
  return out;});}

function crmFor(pid){const {from,to}=app.ui;
  const recs=(D().crm||[]).filter(c=>c.projectId===pid&&(!from||c.to>=from)&&(!to||c.from<=to));
  const quarterView=!!(from&&to&&daysBetween(from,to)>40);
  const months=recs.filter(c=>!c.quarter),q=recs.find(c=>c.quarter);
  const out={status:{},lost:{},svSource:{},prevQl:null,qlStatus:null,labels:[]};
  months.forEach(c=>{out.labels.push(c.label);
    Object.entries(c.status||{}).forEach(([src,st])=>{const o=out.status[src]=out.status[src]||{};Object.entries(st).forEach(([k,v])=>o[k]=(o[k]||0)+v);});
    Object.entries(c.lost||{}).forEach(([rs,ch])=>{const o=out.lost[rs]=out.lost[rs]||{};Object.entries(ch).forEach(([k,v])=>o[k]=(o[k]||0)+v);});
    Object.entries(c.svSource||{}).forEach(([k,v])=>out.svSource[k]=(out.svSource[k]||0)+v);
    if(c.prevQl)out.prevQl=c.prevQl;});
  if(q&&quarterView){if(Object.keys(q.svSource||{}).length)out.svSource=q.svSource;if(q.qlStatus&&Object.keys(q.qlStatus.status||{}).length)out.qlStatus=Object.assign({label:'Qualified leads this quarter · current status'},q.qlStatus);out.prevQl=null;}
  out.has=!!(Object.keys(out.status).length||Object.keys(out.lost).length||Object.keys(out.svSource).length);
  return out;}
const untrackedRe=/utm|didn'?t track|not track|blank|source didn/i;
function crmTotals(c){const st={};Object.values(c.status).forEach(o=>Object.entries(o).forEach(([k,v])=>st[k]=(st[k]||0)+v));
  const leads=Object.values(st).reduce((a,b)=>a+b,0),lostTot=Object.values(c.lost).reduce((a,o)=>a+Object.values(o).reduce((x,y)=>x+y,0),0);
  const reasons=Object.entries(c.lost).map(([r,o])=>({r,n:Object.values(o).reduce((x,y)=>x+y,0)})).sort((a,b)=>b.n-a.n);
  const svT=Object.values(c.svSource).reduce((a,b)=>a+b,0),svU=Object.entries(c.svSource).filter(([k])=>untrackedRe.test(k)).reduce((a,[,v])=>a+v,0);
  return {st,leads,lostTot,reasons,svT,svU};}

function insights(pid){return memo('in|'+pid+'|'+app.ui.from+'|'+app.ui.to,()=>{
  const st=stats(pid),a=st.actual,pl=st.plan,prof=(D().profiles||{})[pid]||{},out=[];

/* ---------- way forward (suggested) ---------- */

/* ---------- month on month (primary view) ---------- */
function monthlyAgg(pids){const by={},plans={};
  pids.forEach(pid=>{effectiveReports(pid,'','').forEach(r=>{const m=r.to.slice(0,7);addTo(by[m]=by[m]||zero(),sumRows(r.rows));});
    effectivePlans(pid,'','').forEach(p=>addTo(plans[p.month]=plans[p.month]||zero(),sumPlans([p])));});
  return Object.keys(by).sort().map(m=>({m,a:by[m],p:plans[m]||zero()}));}
function monthly(pid){return monthlyAgg([pid]);}
function momMoney(pids){const set=new Set(pids),by={};D().money.forEach(m=>{if(set.has(m.projectId)&&m.date){const k=m.date.slice(0,7);by[k]=(by[k]||0)+(+m.amount||0);}});return by;}
function momHtml(pidOrPids,forReport){const pids=Array.isArray(pidOrPids)?pidOrPids:[pidOrPids];let rows=monthlyAgg(pids);if(!rows.length)return '';
  const {to}=app.ui;const endM=to?to.slice(0,7):null;if(endM)rows=rows.filter(x=>x.m<=endM);if(!rows.length)return '';
  const recvBy=momMoney(pids),withMoney=!(forReport&&!showBudget(pids[0]))&&Object.keys(recvBy).length>0;
  const show=rows.slice(-6).map(x=>({...x,a:{...x.a,recv:recvBy[x.m]||0}})),cur=show[show.length-1].a,prev=show.length>1?show[show.length-2].a:null;
  const tot=show.reduce((t,x)=>{Object.keys(x.a).forEach(k=>{if(typeof x.a[k]==='number')t[k]=(t[k]||0)+x.a[k];});return t;},{});
  const M=[...(withMoney?[['Budget received',a=>a.recv,v=>v?inr(v):'—',0]]:[]),['Spend',a=>a.spend,inr,0],['Impressions',a=>a.impr,v=>v?num(v):'—',0],['Clicks',a=>a.clicks,v=>v?num(v):'—',0],['Leads',a=>a.leads,num,1],['CPL',a=>div(a.spend,a.leads),inr,-1],
    ['QL',a=>a.ql,num,1],['QL %',a=>div(a.ql,a.leads),v=>v==null?'—':(v*100).toFixed(1)+'%',1],['CPQL',a=>div(a.spend,a.ql),inr,-1],['SV',a=>a.sv,num,1],['CPSV',a=>div(a.spend,a.sv),inr,-1],['QL to SV %',a=>div(a.sv,a.ql),v=>v==null?'—':(v*100).toFixed(1)+'%',1]]
    .filter(m=>m[0]!=='Impressions'&&m[0]!=='Clicks'||show.some(x=>x.a.impr));
  const chg=(m)=>{if(!prev)return '<td>—</td>';const v=m[1](cur),pv=m[1](prev);if(v==null||pv==null||!pv||(m[0]==='Budget received'&&!v))return '<td>—</td>';
    const r=v/pv-1,good=m[3]===0?null:(m[3]>0?r>0:r<0);const txt=m[0].includes('%')?((v-pv)*100>0?'+':'')+((v-pv)*100).toFixed(1)+' pts':(r>0?'+':'')+(r*100).toFixed(0)+'%';
    return `<td style="color:${Math.abs(r)<0.02||good==null?'inherit':good?'var(--good)':'var(--bad)'};font-weight:600">${Math.abs(r)<0.02?'≈ ':r>0?'▲ ':'▼ '}${txt}</td>`;};
  const title=`Month on month${pids.length>1?` · ${pids.length} projects`:''}`;
  const lm=show[show.length-1].m,lastTo=pids.reduce((m,pid)=>effectiveReports(pid,'','').reduce((n,r)=>r.to.slice(0,7)===lm&&r.to>n?r.to:n,m),''),dim=new Date(+lm.slice(0,4),+lm.slice(5,7),0).getDate();
  const partNote=lastTo&&+lastTo.slice(8,10)<dim?` · ${fmtM(lm)} has reports up to ${fmtD(lastTo)}, so its totals are for part of the month`:'';
  return `<${forReport?'section class="rpt-sec"':'div class="panel"'}>${forReport?`<h2>${title}</h2>`:`<div class="panel-h"><div><h2>${title}</h2><span class="muted" style="font-size:.8rem">${fmtM(show[show.length-1].m)} against ${prev?fmtM(show[show.length-2].m):'—'}, with the months before it${partNote}</span></div></div>`}
    <div class="tw"><table class="mom"><thead><tr><th>Metric</th><th class="mtot">Total<span class="sub">${show.length>1?fmtM(show[0].m)+' – '+fmtM(show[show.length-1].m):fmtM(show[0].m)}</span></th>${show.map(x=>`<th>${fmtM(x.m)}</th>`).join('')}<th>Change vs previous month</th></tr></thead><tbody>
    ${M.map(m=>`<tr${['Spend','Leads','QL','SV'].includes(m[0])&&!(m[0]==='Spend'&&!withMoney)?' class="sep"':''}><td class="t">${m[0]}</td><td class="mtot">${m[2](m[1](tot))}</td>${show.map((x,i)=>`<td${i===show.length-1?' style="font-weight:600"':''}>${m[2](m[1](x.a))}</td>`).join('')}${chg(m)}</tr>`).join('')}
    </tbody></table></div>${forReport?'':'<span class="muted" style="font-size:.78rem">Green is better, red is worse. Change for rates is in percentage points.</span>'}</${forReport?'section':'div'}>`;}

/* ---------- platform split (donut charts) ---------- */
const PCOL={Meta:'var(--accent)',Google:'#C8811A',LinkedIn:'#5B7F3A',Taboola:'#8E5A9E',Other:'var(--muted)',Offline:'var(--line)'};
function platformData(pids){const out={};
  pids.forEach(pid=>{const st=stats(pid);st.reps.flatMap(r=>r.rows).forEach(r=>{const pl=platformFor(pid,r.channel);const o=out[pl]=out[pl]||{a:zero(),p:zero(),pl:zero()};addTo(o.a,r);});
    st.plans.forEach(p=>p.rows.forEach(r=>{const pl=platformFor(pid,r.channel);const o=out[pl]=out[pl]||{a:zero(),p:zero()};addTo(o.p,r);}));});
  return Object.entries(out).filter(([,o])=>o.a.spend||o.p.spend||o.a.leads).sort((x,y)=>(y[1].a.spend+y[1].p.spend)-(x[1].a.spend+x[1].p.spend));}
function donut(parts,label,total){parts=parts.filter(x=>x.v>0);const T=parts.reduce((t,x)=>t+x.v,0);if(!T)return '';
  const cx=150,cy=112,R=90,pt=(a,r)=>[cx+r*Math.sin(a),cy-r*Math.cos(a)];let a0=0;
  const slices=parts.map(x=>{const f=x.v/T,a1=a0+f*2*Math.PI,mid=(a0+a1)/2,col=PCOL[x.k]||'var(--muted)',share=Math.round(f*100)+'%';
    const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R);
    const shape=f>=0.9999?`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${col}"/>`:`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${f>0.5?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
    let lbl;
    if(f>=0.12){const [lx,ly]=f>=0.9999?[cx,cy]:pt(mid,R*0.6);lbl=`<text x="${lx.toFixed(1)}" y="${(ly-2).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" font-family="var(--f-body)">${esc(x.k)}</text><text x="${lx.toFixed(1)}" y="${(ly+13).toFixed(1)}" text-anchor="middle" font-size="12" fill="#fff" font-family="var(--f-body)">${share}</text>`;}
    else{const [ex,ey]=pt(mid,R+4),[ox,oy]=pt(mid,R+16),right=Math.sin(mid)>=0,tx=ox+(right?6:-6);
      lbl=`<polyline points="${ex.toFixed(1)},${ey.toFixed(1)} ${ox.toFixed(1)},${oy.toFixed(1)} ${tx.toFixed(1)},${oy.toFixed(1)}" fill="none" stroke="var(--muted)" stroke-width="1"/><text x="${(tx+(right?3:-3)).toFixed(1)}" y="${(oy+4).toFixed(1)}" text-anchor="${right?'start':'end'}" font-size="11" fill="var(--fg)" font-family="var(--f-body)">${esc(x.k)} ${share}</text>`;}
    a0=a1;return {shape:shape+`<title>${esc(x.k)}: ${inr(x.v)} (${share})</title>`,lbl};});
  return `<figure class="donut pie"><figcaption><span class="label">${esc(label)}</span><strong>${inrC(total)}</strong></figcaption><svg viewBox="0 0 300 224" role="img" aria-label="${esc(label)} by platform: ${parts.map(x=>`${x.k} ${Math.round(x.v/T*100)}%`).join(', ')}">
    ${slices.map(x=>`<g>${x.shape}</g>`).join('')}${slices.map(x=>x.lbl).join('')}</svg></figure>`;}
function platformSplitHtml(pids,forReport){const P=platformData(pids).filter(([k,o])=>o.p.spend||o.a.spend);if(!P.length)return '';
  const planT=P.reduce((t,[,o])=>t+o.p.spend,0),spT=P.reduce((t,[,o])=>t+o.a.spend,0);
  const leg=`<div class="tw"><table><thead><tr><th>Platform</th><th>Budget (planned)</th><th>Share</th><th>Spend</th><th>Share</th><th>% of budget</th></tr></thead><tbody>
    ${P.map(([k,o])=>`<tr><td class="t"><span class="swatch" style="background:${PCOL[k]||'var(--muted)'}"></span>${esc(k)}</td><td>${o.p.spend?inr(o.p.spend):'—'}</td><td>${planT?pct(o.p.spend,planT):'—'}</td><td>${inr(o.a.spend)}</td><td>${pct(o.a.spend,spT)}</td><td>${pct(o.a.spend,o.p.spend)}</td></tr>`).join('')}
    </tbody><tfoot><tr class="total"><td>Total</td><td>${inr(planT)}</td><td>${planT?'100%':'—'}</td><td>${inr(spT)}</td><td>100%</td><td>${pct(spT,planT)}</td></tr></tfoot></table></div>`;

/* ---------- platform-wise target vs achieved and performance ---------- */

/* ---------- channel table in the agreed order ---------- */
function channelTable(chans,plan,actual){
  const names=Object.keys(chans).sort((x,y)=>chans[y].a.spend-chans[x].a.spend);
  if(!names.length)return '<div class="tw"><div class="empty">No data in this period.</div></div>';
  const hasImpr=!!actual.impr;
  const tone=(r,money)=>r==null?'':money?(r>1.05?'var(--bad)':''):(r>=.9?'var(--good)':r>=.6?'var(--warn)':'var(--bad)');

  const cells=(p,a)=>tri(p,a,'spend',inr,true)+(hasImpr?tri(p,a,'impr',num)+tri(p,a,'clicks',num):'')+tri(p,a,'leads',num)+duo(p,a,'leads')+tri(p,a,'ql',num)+`<td class="g">${pct(a.ql,a.leads)}</td>`+duo(p,a,'ql')+tri(p,a,'sv',num)+duo(p,a,'sv')+`<td class="g">${pct(a.sv,a.ql)}</td>`;

  return `<div class="tw"><table class="cht"><thead><tr><th rowspan="2" class="stick">Channel</th>${G.map(([n,c])=>`<th colspan="${c}" class="g grp">${n}</th>`).join('')}</tr><tr>${sub}</tr></thead>

/* projects at risk */
function riskList(ps){
  const endM=app.ui.to?app.ui.to.slice(0,7):null;
  return ps.map(p=>{const s=stats(p.id),t=(((D().profiles||{})[p.id]||{}).targets)||{};let ms=monthly(p.id);if(endM)ms=ms.filter(x=>x.m<=endM);
    const cur=ms[ms.length-1],prev=ms[ms.length-2],R=[];
    // share of the latest month covered by reports, so a half-finished month is compared at the same pace
    let pace=1;if(cur){const lastTo=effectiveReports(p.id,'','').reduce((m,r)=>r.to.slice(0,7)===cur.m&&r.to>m?r.to:m,'');const dim=new Date(+cur.m.slice(0,4),+cur.m.slice(5,7),0).getDate();if(lastTo)pace=Math.min(1,(+lastTo.slice(8,10))/dim);}
    const part=pace<0.97?` (to ${Math.round(pace*100)}% of the month)`:'';
    if(s.media>0){const left=s.balance/s.media;
      if(s.balance<0)R.push({sev:3,t:'Over the media budget by '+inrC(-s.balance)});
      else if(left<0.1)R.push({sev:2,t:`Budget nearly used: ${inrC(s.balance)} left (${(left*100).toFixed(0)}%)`});}
    if(cur){const tgt=+t.cpql||div(cur.p.spend,cur.p.ql),cpql=div(cur.a.spend,cur.a.ql);
      if(cur.a.spend>0&&!cur.a.ql&&cur.p.ql*pace>=3)R.push({sev:3,t:`No qualified leads in ${fmtM(cur.m)}${part} against a target of ${num(cur.p.ql)} for the month`});
      else if(cpql&&tgt&&cpql>tgt*1.2)R.push({sev:2,t:`CPQL ${inr(cpql)} in ${fmtM(cur.m)}, ${Math.round((cpql/tgt-1)*100)}% above the target of ${inr(tgt)}`});}
    if(cur&&prev&&prev.a.ql>=5&&cur.a.ql&&pace>=0.25){const r=cur.a.ql/(prev.a.ql*pace)-1;if(r<=-0.2)R.push({sev:2,t:pace<0.97?`QL pace down ${Math.round(-r*100)}% in ${fmtM(cur.m)}: ${num(cur.a.ql)} so far${part}, against ${num(prev.a.ql)} in all of ${fmtM(prev.m)}`:`QL down ${Math.round(-r*100)}% in ${fmtM(cur.m)}: ${num(cur.a.ql)} against ${num(prev.a.ql)} in ${fmtM(prev.m)}`});}
    return {p,R,s,sev:R.reduce((m,x)=>Math.max(m,x.sev),0)};})
    .filter(o=>o.R.length).sort((a,b)=>b.sev-a.sev||b.R.length-a.R.length||b.s.actual.spend-a.s.actual.spend);
}
function riskPanel(ps){const list=riskList(ps);

/* ---------- creative analysis: statics vs videos, message themes, inferences and suggestions ---------- */
const CFMT=['Static','Video','Carousel','Text','Unclassified'];
const CFMT_LABEL={Static:'Statics',Video:'Videos',Carousel:'Carousels',Text:'Text / search ads',Unclassified:'Format not known'};
function creativeFormat(name,pid){const n=String(name||'').toLowerCase();
  if(/carousel|catalog|collection/.test(n))return 'Carousel';
  if(/video|\bvid\b|reel|\b\d{1,3}\s?s(ec)?\b|\.mp4|\.mov|youtube|\byt\b|\bugc\b|walkthrough|shorts|motion/.test(n))return 'Video';
  if(/\brsa\b|responsive search|text ad|search ad/.test(n))return 'Text';
  if(/static|image|\bimg\b|banner|\bpost\b|\d{3,4}\s?x\s?\d{3,4}|\.jpe?g|\.png|poster|single/.test(n))return 'Static';
  const d=pid&&thumbFor(pid,name);if(d){const k=fileKind(d.file||d.title,d.mime);if(k==='video')return 'Video';if(k==='image')return 'Static';}
  return 'Unclassified';}
const THEMES=[['Festive / offer',/diwali|ganpati|ganesh|navratri|festive|dussehra|akshaya|gudi|offer|deal|discount|launch/],
  ['Price & payment plan',/price|emi|payment|onwards|lakh|\bcr\b/],['Connectivity & location',/connect|location|metro|highway|station|airport|commute|distance|locat/],
  ['Amenities & lifestyle',/amenit|club|pool|lifestyle|garden|gym|leisure/],['Family',/family|kids|child|parent/],['Site walkthrough',/walkthrough|site\s?visit|tour|sample\s?flat|show\s?flat/],
  ['Configuration',/bhk|config|floor\s?plan|layout|carpet/],['Testimonial / talent',/testimonial|\bugc\b|influencer|review/],['Brand / developer',/legacy|developer|trust|heritage/]];
function creativeTheme(name){const n=String(name||'').toLowerCase();const t=THEMES.find(([,re])=>re.test(n));return t?t[0]:'Other';}
function creativeRows(pid){return memo('cr|'+pid+'|'+app.ui.from+'|'+app.ui.to,()=>{const cf=rawAgg(pid,'','creative'),pls=new Set(cf.map(r=>r.platform));
  const rows=cf.concat(rawAgg(pid,'','full').filter(r=>!pls.has(r.platform)&&r.ad&&r.ad!=='—'));const p=proj(pid);
  return topRows(rows,'ad').filter(r=>r.spend>0||r.leads>0).map(r=>Object.assign(r,{pid,projectName:p?p.name:'',format:creativeFormat(r.name,pid),theme:creativeTheme(r.name)}));});}
function fmtAgg(rs){const o={n:rs.length,spend:0,impr:0,clicks:0,leads:0,spendQ:0,leadsQ:0,ql:0,sv:0,hasQ:false};
  rs.forEach(r=>{o.spend+=r.spend;o.impr+=r.impr||0;o.clicks+=r.clicks||0;o.leads+=r.leads;if(r.ql!=null){o.hasQ=true;o.spendQ+=r.spend;o.leadsQ+=r.leads;o.ql+=r.ql;o.sv+=r.sv||0;}});return o;}
const cfCost=(x,useQ)=>useQ?(x.ql>0?x.spendQ/x.ql:null):(x.leads>0?x.spend/x.leads:null);
function creativeInsights(rows,board){const obs=[],wf=[];if(!rows.length)return {obs,wf,useQ:false};
  const P=x=>x==null?'—':(x*100).toFixed(0)+'%',tot=fmtAgg(rows),F={};
  ['Static','Video','Carousel'].forEach(f=>{const rs=rows.filter(r=>r.format===f);if(rs.length)F[f]=fmtAgg(rs);});
  const useQ=Object.values(F).filter(x=>x.ql>=3).length>=2||(Object.keys(F).length<2&&tot.ql>=3),cn=useQ?'CPQL':'CPL',unit=useQ?'qualified lead':'lead';
  const cost=x=>cfCost(x,useQ),enough=x=>useQ?x.ql>=3:x.leads>=10,lc=f=>CFMT_LABEL[f].toLowerCase();
  const fs=Object.entries(F).filter(([,x])=>cost(x)!=null&&enough(x)).sort((a,b)=>cost(a[1])-cost(b[1]));
  if(fs.length>=2){const [bf,b]=fs[0],[wf2,w]=fs[fs.length-1],gap=1-cost(b)/cost(w),sh=b.spend/tot.spend;
    obs.push(`${CFMT_LABEL[bf]} delivered ${unit}s at ${inr(cost(b))} ${cn}, against ${inr(cost(w))} for ${lc(wf2)}${gap>=0.05?` (${Math.round(gap*100)}% cheaper)`:''}. ${CFMT_LABEL[bf]} took ${P(sh)} of creative spend.`);
    if(gap>=0.15){if(sh<0.5)wf.push(`Move more creative budget to ${lc(bf)}: they cost ${Math.round(gap*100)}% less per ${unit} but take only ${P(sh)} of creative spend. ${wf2==='Video'?'Keep videos for reach and retarget people who watched half or more of them.':`Keep ${lc(wf2)} running for price, configuration and offer messages.`}`);
      else wf.push(`Keep ${lc(bf)} as the main format (${cn} ${inr(cost(b))}). Rework ${lc(wf2)} ${wf2==='Video'?'with a stronger first 3 seconds, price or offer on screen, and a 15–20 second cut':'with a clearer price, location and a single call to action'}.`);}}
  if(F.Static&&!F.Video&&tot.spend>0)wf.push(`No video creatives ran in this period. Test 2–3 short videos (15–30 seconds: site walkthrough, amenities or connectivity) against the best static to find a second winning format.`);
  if(F.Video&&!F.Static&&tot.spend>0)wf.push(`Only videos ran in this period. Add 2–3 statics carrying the price, configuration and location so budget can follow the better format.`);
  if(useQ&&F.Static&&F.Video&&F.Static.leadsQ>=20&&F.Video.leadsQ>=20){const qs=F.Static.ql/F.Static.leadsQ,qv=F.Video.ql/F.Video.leadsQ;
    if(Math.abs(qs-qv)>=0.03)obs.push(`${qs>qv?'Statics':'Videos'} bring better-quality leads: ${P(Math.max(qs,qv))} qualify against ${P(Math.min(qs,qv))} for ${qs>qv?'videos':'statics'}.`);}
  const elig=r=>useQ?(r.ql||0)>=3&&r.leads>=10:r.leads>=10;
  ['Static','Video'].forEach(f=>{const b=rankRows(rows.filter(r=>r.format===f&&elig(r)),useQ?'cpql':'cpl')[0];
    if(b)obs.push(`Best ${f.toLowerCase()}: ${b.name}${board?` (${b.projectName})`:''} at ${inr(useQ?b.spend/b.ql:b.spend/b.leads)} ${cn}${useQ?` with ${P(div(b.ql,b.leads))} of leads qualifying`:''}${b.theme!=='Other'?`, ${b.theme.toLowerCase()} message`:''}.`);});
  const th={};rows.filter(r=>r.theme!=='Other').forEach(r=>(th[r.theme]=th[r.theme]||[]).push(r));
  const ts=Object.entries(th).map(([t,rs])=>[t,fmtAgg(rs)]).filter(([,x])=>enough(x)&&cost(x)!=null).sort((a,b)=>cost(a[1])-cost(b[1]));
  if(ts.length>=2){const [bt,b]=ts[0],[wt,w]=ts[ts.length-1];if(cost(w)>cost(b)*1.2){
    obs.push(`By message, ${bt.toLowerCase()} creatives perform best at ${inr(cost(b))} ${cn}; ${wt.toLowerCase()} creatives cost the most at ${inr(cost(w))}.`);
    wf.push(`Brief the design team on more ${bt.toLowerCase()}-led creatives, in both static and video, and scale back ${wt.toLowerCase()} messaging.`);}}
  const thr=Math.max(15000,tot.spend*0.05),drains=rows.filter(r=>r.spend>=thr&&(r.ql!=null&&useQ?r.ql<1:r.leads<1)).sort((a,b)=>b.spend-a.spend);
  if(drains.length){const s=drains.reduce((t,r)=>t+r.spend,0),nm=drains.slice(0,3).map(r=>r.name+(board?` (${r.projectName})`:'')).join(', ');
    obs.push(`${drains.length} creative${drains.length>1?'s':''} spent ${inr(s)} without a ${unit}: ${nm}${drains.length>3?' and others':''}.`);
    wf.push(`Pause or rework ${nm}: ${inr(s)} spent with no ${unit}. Replace ${drains.length>1?'them':'it'} with variants of the best creative.`);}
  else{const avg=cost(tot);const costly=avg?rows.filter(r=>r.spend>=thr&&elig(r)&&(useQ?r.spend/r.ql:r.spend/r.leads)>avg*1.6).sort((a,b)=>b.spend-a.spend):[];
    if(costly.length)wf.push(`Cut spend on ${costly.slice(0,3).map(r=>r.name+(board?` (${r.projectName})`:'')).join(', ')}: ${cn} is more than 60% above the average of ${inr(avg)}.`);}
  const top=[...rows].sort((a,b)=>b.spend-a.spend)[0];
  if(!board&&rows.length>=3&&top.spend/tot.spend>=0.4)wf.push(`${top.name} carries ${P(top.spend/tot.spend)} of creative spend. Add fresh variants of its message now so results hold as it fatigues.`);
  const win=rankRows(rows.filter(elig),useQ?'cpql':'cpl')[0];

function guessProjectFor(text,mine,fallback){const n=' '+normS(text)+' ';

async function videoFrames(file){const url=URL.createObjectURL(file),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  await new Promise((ok,bad)=>{v.onloadeddata=ok;v.onerror=()=>bad(new Error('video'));setTimeout(()=>bad(new Error('timeout')),20000);});
  const dur=isFinite(v.duration)?v.duration:0,ts=[Math.min(1,dur*0.15),Math.min(3,dur*0.35),dur/2].map(t=>Math.max(0,Math.min(Math.max(0,dur-0.05),t)));
  const frames=[];for(const t of ts){if(Math.abs(v.currentTime-t)>0.01)await new Promise(ok=>{v.onseeked=ok;v.currentTime=t;setTimeout(ok,4000);});
    const W=Math.min(720,v.videoWidth||720),H=Math.round(W*(v.videoHeight||1280)/(v.videoWidth||720)),c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(v,0,0,W,H);frames.push({t,src:c.toDataURL('image/jpeg',0.78)});}
  return {frames,duration:dur,url};}
async function shrinkImage(file,max){const url=URL.createObjectURL(file);try{const im=await loadImg(url),k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.82);}finally{URL.revokeObjectURL(url);}}
async function addStudioFiles(list){const u=app.ui,p=proj(u.stuPid);if(!p||!canStudio(p.id))return;
  const files=[...list].filter(f=>/^(image|video)\//.test(f.type)||/\.(jpe?g|png|webp|gif|mp4|mov|webm|m4v)$/i.test(f.name));
  if(!files.length){toast('Choose JPG, PNG or WebP images, or MP4, MOV or WebM videos.');return;}
  u.stuBusy=true;render();const recs=[],bad=[];
  for(const f of files){const id=uid('d'),kind=fileKind(f.name,f.type);
    const base={id,projectId:p.id,category:'creative',title:f.name.replace(/\.[^.]+$/,''),channel:u.stuChannel||'Meta',file:f.name,size:f.size,mime:f.type||(kind==='video'?'video/mp4':'image/jpeg'),uploadedBy:u.viewer,at:nowStamp(),note:'Added in the creative studio'};
    try{if(kind==='video'){const v=await videoFrames(f);base.frames=v.frames;base.duration=Math.round(v.duration);const url=await Store.putFile(f);base.url=url||null;if(!url)BLOBS[id]=v.url;}
      else{const url=await Store.putFile(f);base.url=url||await shrinkImage(f,1080);}recs.push(base);}catch(e){bad.push(f.name);}}
  u.stuBusy=false;if(bad.length)toast(`Could not read ${bad.join(', ')}.`);if(!recs.length){render();return;}
  u.studio=recs[0].id;u.stuFrame=0;u.gen=null;u.stuAI='';
  await commit(d=>{d.docs=(d.docs||[]).concat(recs);},`Added ${recs.length} creative${recs.length>1?'s':''} in the creative studio for ${p.name}`,p.id);
  if(Store.mode==='local'&&recs.some(r=>r.frames&&!r.url))toast('Video added. In this browser-only version the video plays until the page is reloaded; its frames and readings are kept.');
  const sp=document.getElementById('studioPanel');if(sp&&sp.scrollIntoView)sp.scrollIntoView({block:'start'});}

  else if(c==='stuChannel'){e.stopImmediatePropagation();app.ui.stuChannel=el.value;}},true);
